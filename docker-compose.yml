version: '3.8'

services:
  earlytrend:
    build: .
    container_name: earlytrend-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_DEBUG=True
      - DATABASE_URL=sqlite:///./earlytrend.db
      - NUM_PRODUCTS=150
      - DAYS_HISTORY=30
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - earlytrend-network

volumes:
  earlytrend-data:
  earlytrend-logs:
  earlytrend-models:

networks:
  earlytrend-network:
    driver: bridge
